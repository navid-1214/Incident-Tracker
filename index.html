<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>مدیریت اینسیدنت‌ها</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>مدیریت اینسیدنت‌ها</h1><small id="count">0 اینسیدنت</small></div><button id="addBtn">＋ ثبت اینسیدنت</button></header><main><input id="search" class="search" placeholder="جستجو در شماره، موضوع یا پیمانکار..."><div class="table-wrap"><table><thead><tr><th>شماره اینسیدنت</th><th>موضوع اینسیدنت</th><th>تاریخ ثبت</th><th>پیمانکار</th><th>تاریخ پیگیری ۱</th><th>تاریخ پیگیری ۲</th><th>درصد پیشرفت</th><th>زمان سپری‌شده از ثبت</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="modal" class="modal hidden"><div class="card"><div class="card-head"><h2>ثبت اینسیدنت</h2><button id="closeBtn" class="icon">×</button></div><form id="form"><label>شماره اینسیدنت<input id="number" required></label><label>موضوع اینسیدنت<textarea id="subject" required></textarea></label><label>پیمانکار<input id="contractor"></label><label>تاریخ ثبت<input id="registeredAt" type="datetime-local" required></label><label>تاریخ پیگیری ۱<input id="follow1" type="datetime-local"></label><label>تاریخ پیگیری ۲<input id="follow2" type="datetime-local"></label><label>درصد پیشرفت<input id="progress" type="range" min="0" max="100" value="0"><output id="progressOut">0٪</output></label><div class="actions"><button type="button" id="cancelBtn" class="secondary">لغو</button><button type="submit">ثبت</button></div></form></div></div><script src="app.js"></script></body></html>
