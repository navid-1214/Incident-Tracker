<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Incident</title><link rel="stylesheet" href="style.css"></head><body><header><div><h1>Incident</h1><small id="count">0</small></div><button id="addBtn">＋ ثبت Incident</button></header><main><div class="toolbar"><input id="search" class="search" placeholder="جستجو در شماره، موضوع یا پیمانکار..."><button id="notifyBtn">فعال‌سازی اعلان</button></div><div class="legend"><span>باز</span><span>در حال پیگیری</span><span>بسته</span><span class="orange">بیش از ۲۴ ساعت</span><span class="red">بیش از ۴۸ ساعت</span></div><div class="table-wrap"><table><thead><tr><th>شماره Incident</th><th>موضوع Incident</th><th>تاریخ ثبت</th><th>پیمانکار</th><th>تاریخ پیگیری ۱</th><th>تاریخ پیگیری ۲</th><th>وضعیت</th><th>درصد پیشرفت</th><th>زمان سپری‌شده</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="modal" class="modal hidden"><div class="card"><div class="card-head"><h2>ثبت Incident</h2><button id="closeBtn" class="icon">×</button></div><form id="form"><label>شماره Incident<input id="number" required></label><label>موضوع Incident<textarea id="subject" required></textarea></label><label>پیمانکار<input id="contractor"></label><label>تاریخ ثبت<input id="registeredAt" type="datetime-local" required></label><label>تاریخ پیگیری ۱<input id="follow1" type="datetime-local"></label><label>تاریخ پیگیری ۲<input id="follow2" type="datetime-local"></label><label>وضعیت<select id="status"><option value="open">باز</option><option value="follow">در حال پیگیری</option><option value="closed">بسته</option></select></label><label>درصد پیشرفت<input id="progress" type="range" min="0" max="100" value="0"><output id="progressOut">0٪</output></label><div class="actions"><button type="button" id="cancelBtn">لغو</button><button type="submit">ثبت</button></div></form></div></div><script src="app.js"></script></body></html>
